[project]
name = "semantic-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["battlefield-semantic-core==0.1.0", "battlefield-source-runtime==0.1.0", "battlefield-geo==0.1.0", "httpx>=0.28", "fastapi>=0.115", "uvicorn>=0.34", "python-dotenv>=1"]
[project.scripts]
semantic-api = "semantic_api.app:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
