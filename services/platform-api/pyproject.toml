[project]
name = "platform-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "aiosqlite>=0.21", "httpx>=0.28", "openai>=1.100,<3", "mcp>=1.20,<2", "jsonschema>=4.23", "c4i-contracts==0.1.0", "platform-contracts==0.1.0", "battlefield-geo==0.1.0", "battlefield-ontology==0.1.0", "python-dotenv>=1.0"]
[project.scripts]
platform-api = "platform_api.app:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/platform_api/web_static/**"]

