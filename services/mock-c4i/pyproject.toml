[project]
name = "mock-c4i"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "aiosqlite>=0.21", "c4i-contracts==0.1.0", "battlefield-geo==0.1.0", "python-dotenv>=1.0"]
[project.scripts]
mock-c4i = "mock_c4i.app:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["src/mock_c4i/web_static/**"]

