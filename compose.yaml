name: battlefield-poc
x-neo4j: &neo4j
  image: neo4j:2026.09.0@sha256:6f3f17e72d69bb6f26b03f6186f5afb15a201f8b460bb69b0cd8030717f9f01a
  environment:
    NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in local .env}
    NEO4J_server_memory_heap_initial__size: 128m
    NEO4J_server_memory_heap_max__size: 512m
    NEO4J_server_memory_pagecache_size: 256m
  healthcheck:
    test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 15s
services:
  neo4j:
    <<: *neo4j
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j-data:/data"]
  neo4j-test:
    <<: *neo4j
    profiles: ["test"]
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
    volumes: ["neo4j-test-data:/data"]
volumes:
  neo4j-data:
  neo4j-test-data:
